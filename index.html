  <style>:root{--primary:#8B1E3F;--primary-dark:#6B1530;--primary-light:#A52A55;--secondary:#D98C9A;--secondary-light:#EAB4BF;--accent:#D4AF6A;--accent-light:#E6C78E;--accent-dark:#B8964F;--cream:#FFF8F0;--cream-dark:#F5EBE0;--dark:#241A1D;--dark-soft:#3A2D31;--green:#315C45;--green-light:#4A7A5E;--peach:#F8E1D3;--ivory:#FDFBF7;--white:#FFFFFF;--text-muted:#8A7A7E;--text-dark:#2E2226;--border-gold:rgba(212, 175, 106, .35);--shadow-sm:0 2px 12px rgba(36, 26, 29, .06);--shadow-md:0 8px 30px rgba(36, 26, 29, .1);--shadow-lg:0 20px 60px rgba(36, 26, 29, .15);--shadow-gold:0 8px 30px rgba(212, 175, 106, .25);--font-heading:"Playfair Display", "Cormorant Garamond", Georgia, serif;--font-serif:"Cormorant Garamond", Georgia, serif;--font-body:"Poppins", "Inter", system-ui, sans-serif;--container-max:1280px;--section-padding:clamp(4rem, 8vw, 8rem);--radius-sm:8px;--radius-md:16px;--radius-lg:24px;--radius-full:999px;--ease-out:cubic-bezier(.22, 1, .36, 1);--ease-in-out:cubic-bezier(.65, 0, .35, 1);--ease-luxury:cubic-bezier(.16, 1, .3, 1)}*,*:before,*:after{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:clip}body{margin:0;font-family:var(--font-body);font-weight:400;font-size:16px;line-height:1.7;color:var(--text-dark);background-color:var(--ivory);overflow-x:clip;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}@keyframes rotateSlow{0%{transform:rotate(0)}to{transform:rotate(360deg)}}.app-loading-screen{position:fixed;inset:0;background:var(--ivory);display:flex;align-items:center;justify-content:center;z-index:9999}.app-loading-petal{width:50px;height:50px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:rotateSlow 1s linear infinite}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}</style><link rel="stylesheet" href="styles.
